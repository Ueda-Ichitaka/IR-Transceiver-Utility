# ir-app - the Kirigami GUI of the IR Transceiver Utility.
#
# Builds the `ir-transceiver` binary: the KDE application setup (KAboutData,
# KCrash, KI18n via cxx-kde-frameworks), cxx-qt bridge objects for QML and the
# QML pages.
[package]
name = "ir-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ir-transceiver"
path = "src/main.rs"

[dependencies]
cxx = "1.0.192"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
cxx-qt-lib-extras = "0.10.0"
# Not on crates.io; pinned to the reviewed commit of master (cxx-qt 0.10).
cxx-kde-frameworks = { git = "https://invent.kde.org/libraries/cxx-kde-frameworks.git", rev = "5c51af42ad078feb89e4b7e590da9e3eab9e4d6d" }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
