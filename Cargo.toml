# Cargo workspace for the IR Transceiver Utility.
#
# Groups the crates that make up the app: the pure protocol crate (elk-proto),
# the byte encodings (ir-codec), other tools' file formats (ir-formats), the
# code library (ir-library), the user settings (ir-settings), the USB
# transport crate (ir-transport, which also builds the elk-probe tool), the
# device session (ir-session) and the Kirigami GUI (ir-app). Shared package
# metadata and dependency versions live here.
[workspace]
resolver = "3"
exclude = ["third_party"]
members = [
    "crates/elk-proto",
    "crates/ir-app",
    "crates/ir-codec",
    "crates/ir-formats",
    "crates/ir-library",
    "crates/ir-session",
    "crates/ir-settings",
    "crates/ir-transport",
    "crates/ir-view",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# Debian stable (trixie) ships rustc 1.85.
rust-version = "1.85"

[workspace.dependencies]
elk-proto = { path = "crates/elk-proto" }
nusb = "0.2.9"
base64 = "0.23.1"
ir-codec = { path = "crates/ir-codec" }
ir-transport = { path = "crates/ir-transport" }
ir-session = { path = "crates/ir-session" }
ir-library = { path = "crates/ir-library" }
ir-settings = { path = "crates/ir-settings" }

# cmake-package passes header-only CMake targets such as Qt6::QmlIntegration
# to rustc as link libraries, which breaks cxx-kde-frameworks. The patched
# copy skips them; see third_party/PATCHED.md.
[patch.crates-io]
cmake-package = { path = "third_party/cmake-package" }
